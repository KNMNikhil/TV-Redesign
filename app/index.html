<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Wallpaper: two layers so changing it crossfades. -->
  <div id="wpA" class="wp"></div>
  <div id="wpB" class="wp"></div>
  <div id="shade"></div>

  <div id="clock"></div>

  <!-- Top right: wallpaper, all apps, settings menu. -->
  <div id="topIcons">
    <div class="ti" id="tiWall" title="Wallpaper">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5.5-5.5 4 4 3-3L21 18"/></svg>
    </div>
    <div class="ti" id="tiApps" title="All apps">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
    </div>
    <div class="ti" id="tiSettings" title="Settings">
      <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.030,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.030,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.030,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/></svg>
    </div>
  </div>

  <!-- Small month calendar on the right. -->
  <div id="cal">
    <div id="calHead">
      <div id="calTitle"><span id="calMonth"></span><span id="calYear"></span></div>
      <div id="calNav"><span id="calPrev">&#8249;</span><span id="calNext">&#8250;</span></div>
    </div>
    <div id="calDow"></div>
    <div id="calGrid"></div>
    <div id="calFoot"><div id="calFootDate"></div><div id="calFootRel"></div></div>
  </div>

  <!-- Favourites: the big list on the left. -->
  <div id="favView"><ul id="favs"></ul></div>

  <!-- All apps overlay. -->
  <div id="apps" class="overlay hidden">
    <div id="appsBlur"></div>
    <div id="appsTitle">All apps</div>
    <div id="appsView"><div id="appsGrid"></div></div>
    <div id="appsHint">Hold OK on an app for options</div>
  </div>

  <!-- Wallpaper picker along the bottom. -->
  <div id="wallPicker" class="hidden">
    <div id="wallName"></div>
    <div id="wallThumbs"></div>
  </div>

  <!-- Settings menu and its sub-menus. -->
  <div id="menu" class="hidden"></div>

  <!-- Idle screen: dimmed wallpaper and a slowly moving clock. -->
  <div id="ambient" class="hidden"><div id="ambClock"></div><div id="ambDate"></div></div>

  <div id="toast"></div>

  <script src="config.js"></script>
  <script src="apps.js"></script>
  <script src="app.js"></script>
</body>
</html>
